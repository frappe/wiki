<!-- Table of Contents (Right Sidebar) - Server-rendered for reliability -->
<!-- Styling mirrors frappe-ui docs OnThisPage: a faint left rail per link, the
     active heading darkening its own segment. -->
<aside id="wiki-toc" class="hidden lg:block flex-shrink-0 py-6 pr-6 {% if toc_headings and toc_headings|length > 0 %}w-56{% else %}w-0 !p-0{% endif %}">
{% if toc_headings and toc_headings|length > 0 %}
    <nav class="sticky top-[77px] max-h-[calc(100vh-8rem)] overflow-y-auto no-scrollbar flex flex-col leading-relaxed">
        <!-- Transparent border keeps the label on the same left edge as the links. -->
        <span class="font-medium whitespace-nowrap pl-4 pb-1 border-l border-transparent text-[var(--ink-gray-9)]">On this page</span>
        {% for heading in toc_headings %}
        <a href="#{{ heading.id }}"
           data-toc-link="{{ heading.id }}"
           class="toc-link {{ 'pl-7' if heading.level >= 3 else 'pl-4' }} py-1 border-l border-[var(--outline-gray-2)] text-[var(--ink-gray-6)] transition-colors duration-200 hover:text-[var(--ink-gray-9)]">
            {{ heading.text }}
        </a>
        {% endfor %}
    </nav>
{% endif %}
</aside>

<style>
    /* Active TOC link: darken its rail segment + text (frappe-ui outline-gray-7). */
    .toc-link.active {
        border-color: var(--outline-gray-7) !important;
        color: var(--ink-gray-9) !important;
    }
</style>

<script>
    // Initialize TOC store for external refresh capability
    document.addEventListener('alpine:init', () => {
        Alpine.store('toc', {
            refreshCallback: null,

            setRefreshCallback(callback) {
                this.refreshCallback = callback;
            },

            refresh() {
                if (this.refreshCallback) {
                    this.refreshCallback();
                }
            }
        });
    });
</script>
