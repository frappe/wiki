<style>
	.wiki-document-pdf {
		color: #111827;
		font-family:
			Inter,
			"Segoe UI",
			Roboto,
			"Helvetica Neue",
			Arial,
			sans-serif;
		font-size: 12px;
		line-height: 1.7;
	}

	.wiki-document-pdf .wiki-document-shell {
		max-width: 760px;
		margin: 0 auto;
	}

	.wiki-document-pdf .wiki-document-header {
		padding-bottom: 18px;
		border-bottom: 1px solid #e5e7eb;
		margin-bottom: 28px;
	}

	.wiki-document-pdf .wiki-document-eyebrow {
		font-size: 10px;
		font-weight: 700;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: #6b7280;
		margin-bottom: 10px;
	}

	.wiki-document-pdf .wiki-document-title {
		font-size: 30px;
		line-height: 1.15;
		font-weight: 800;
		letter-spacing: -0.03em;
		margin: 0 0 14px;
		color: #0f172a;
	}

	.wiki-document-pdf .wiki-document-meta {
		display: table;
		width: 100%;
		border-collapse: collapse;
		margin-top: 10px;
	}

	.wiki-document-pdf .wiki-document-meta-row {
		display: table-row;
	}

	.wiki-document-pdf .wiki-document-meta-label,
	.wiki-document-pdf .wiki-document-meta-value {
		display: table-cell;
		padding: 6px 0;
		vertical-align: top;
	}

	.wiki-document-pdf .wiki-document-meta-label {
		width: 120px;
		font-size: 10px;
		font-weight: 700;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		color: #6b7280;
	}

	.wiki-document-pdf .wiki-document-meta-value {
		font-size: 12px;
		color: #1f2937;
	}

	.wiki-document-pdf .wiki-document-route {
		font-family: Menlo, Monaco, Consolas, "Liberation Mono", monospace;
		font-size: 11px;
		word-break: break-all;
	}

	.wiki-document-pdf .wiki-document-content {
		font-size: 13px;
		color: #111827;
	}

	.wiki-document-pdf .wiki-document-content h1,
	.wiki-document-pdf .wiki-document-content h2,
	.wiki-document-pdf .wiki-document-content h3,
	.wiki-document-pdf .wiki-document-content h4,
	.wiki-document-pdf .wiki-document-content h5,
	.wiki-document-pdf .wiki-document-content h6 {
		color: #0f172a;
		line-height: 1.2;
		margin-top: 1.7em;
		margin-bottom: 0.6em;
		page-break-after: avoid;
	}

	.wiki-document-pdf .wiki-document-content h1 {
		font-size: 26px;
		font-weight: 800;
		letter-spacing: -0.02em;
	}

	.wiki-document-pdf .wiki-document-content h2 {
		font-size: 21px;
		font-weight: 750;
		letter-spacing: -0.02em;
	}

	.wiki-document-pdf .wiki-document-content h3 {
		font-size: 17px;
		font-weight: 700;
	}

	.wiki-document-pdf .wiki-document-content p,
	.wiki-document-pdf .wiki-document-content ul,
	.wiki-document-pdf .wiki-document-content ol,
	.wiki-document-pdf .wiki-document-content pre,
	.wiki-document-pdf .wiki-document-content table,
	.wiki-document-pdf .wiki-document-content blockquote {
		margin-top: 0;
		margin-bottom: 1em;
	}

	.wiki-document-pdf .wiki-document-content ul,
	.wiki-document-pdf .wiki-document-content ol {
		padding-left: 1.4em;
	}

	.wiki-document-pdf .wiki-document-content li + li {
		margin-top: 0.25em;
	}

	.wiki-document-pdf .wiki-document-content a {
		color: #0f172a;
		text-decoration: underline;
	}

	.wiki-document-pdf .wiki-document-content img {
		max-width: 100%;
		height: auto;
		border-radius: 10px;
	}

	.wiki-document-pdf .wiki-document-content pre {
		white-space: pre-wrap;
		word-break: break-word;
		background: #f8fafc;
		border: 1px solid #e5e7eb;
		border-radius: 10px;
		padding: 14px 16px;
		font-size: 11px;
		line-height: 1.6;
	}

	.wiki-document-pdf .wiki-document-content code {
		font-family: Menlo, Monaco, Consolas, "Liberation Mono", monospace;
		font-size: 0.92em;
	}

	.wiki-document-pdf .wiki-document-content table {
		width: 100%;
		border-collapse: collapse;
		font-size: 11px;
	}

	.wiki-document-pdf .wiki-document-content th,
	.wiki-document-pdf .wiki-document-content td {
		border: 1px solid #e5e7eb;
		padding: 8px 10px;
		vertical-align: top;
		text-align: left;
	}

	.wiki-document-pdf .wiki-document-content th {
		background: #f8fafc;
		font-weight: 700;
	}

	.wiki-document-pdf .wiki-document-content blockquote {
		border-left: 3px solid #cbd5e1;
		padding: 8px 0 8px 14px;
		color: #475569;
	}

	.wiki-document-pdf .wiki-document-content hr {
		border: 0;
		border-top: 1px solid #e5e7eb;
		margin: 28px 0;
	}
</style>

<div class="page-break wiki-document-pdf">
	<div class="wiki-document-shell">
		<header class="wiki-document-header">
			{% if doc.pdf_space_name %}
			<div class="wiki-document-eyebrow">{{ doc.pdf_space_name }}</div>
			{% endif %}
			<h1 class="wiki-document-title">{{ doc.title }}</h1>

			<div class="wiki-document-meta">
				{% if doc.pdf_route %}
				<div class="wiki-document-meta-row">
					<div class="wiki-document-meta-label">{{ _("Path") }}</div>
					<div class="wiki-document-meta-value wiki-document-route">/{{ doc.pdf_route }}</div>
				</div>
				{% endif %}

				{% if doc.pdf_last_updated_on %}
				<div class="wiki-document-meta-row">
					<div class="wiki-document-meta-label">{{ _("Updated") }}</div>
					<div class="wiki-document-meta-value">{{ doc.pdf_last_updated_on }}</div>
				</div>
				{% endif %}
			</div>
		</header>

		<div class="wiki-document-content">
			{{ doc.rendered_content_for_pdf or "" }}
		</div>
	</div>
</div>
