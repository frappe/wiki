name: CI

on:
  push:
    branches:
      - develop
      - main
      - version-3
      - ci/pilot
    paths-ignore:
      - '**.js'
      - '**.vue'
      - '**.css'
      - '**.ts'
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.vue'
      - '**.css'
      - '**.ts'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-wiki-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe-branch: version-15
            python-version: '3.11'
            test-args: ''
          - frappe-branch: develop
            python-version: '3.14'
            test-args: '--test-category all'
    name: Server (${{ matrix.frappe-branch }})

    # Pilot runs with --ci, so it provisions no database server of its own;
    # the bench points at this container instead.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Get OS version
        id: os
        run: echo "version=$(. /etc/os-release && echo "$VERSION_ID")" >> "$GITHUB_OUTPUT"

      - name: Cache pip and uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-uv-ubuntu-${{ steps.os.outputs.version }}-${{ matrix.frappe-branch }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-ubuntu-${{ steps.os.outputs.version }}-${{ matrix.frappe-branch }}-
            ${{ runner.os }}-uv-ubuntu-${{ steps.os.outputs.version }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Pilot
        run: |
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh -s -- --ci
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch "${{ matrix.frappe-branch }}"
          pilot -b frappe-bench set-bench-config python "${{ matrix.python-version }}"
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          pilot -b frappe-bench set-bench-config mariadb_existing true
          pilot -b frappe-bench set-bench-config mariadb_host 127.0.0.1
          pilot -b frappe-bench set-bench-config mariadb_port 3306
          pilot -b frappe-bench set-bench-config mariadb_admin_user root
          pilot -b frappe-bench set-bench-config mariadb_password root
          pilot -b frappe-bench init --skip-frontend
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Wiki
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          uv pip install --python env/bin/python -e "apps/frappe[test]"
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
        env:
          CI: 'Yes'

      - name: Start Pilot
        run: |
          pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7000/api/v1/health

      - name: Create Test Site
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot new-site test_site --admin-password admin --apps frappe wiki --skip-assets
          pilot build --apps wiki

      - name: Run Tests
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot frappe --site test_site set-config allow_tests true
          pilot frappe --site test_site run-tests --app wiki ${{ matrix.test-args }}
        env:
          TYPE: server

      - name: Show Pilot logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/pilot.log" || true
