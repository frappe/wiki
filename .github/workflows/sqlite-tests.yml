name: Server Tests (SQLite)

on:
  schedule:
    # Mondays, 10:00 IST
    - cron: '30 4 * * 1'
  workflow_dispatch:

concurrency:
  group: sqlite-tests-wiki-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'frappe/wiki' }}
    name: Server (develop, sqlite)

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Setup
        run: |
          uv tool install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch develop --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --skip-assets wiki $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench build &> build.log &
          build_pid=$!
          bench new-site --db-type sqlite --admin-password admin test_site
          bench --site test_site install-app wiki
          wait $build_pid || { cat build.log; exit 1; }
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app wiki --test-category all
        env:
          TYPE: server
