name: Server Tests (SQLite)

on:
  schedule:
    # Mondays, 10:00 IST
    - cron: '30 4 * * 1'
  workflow_dispatch:
  pull_request:

concurrency:
  group: sqlite-tests-wiki-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'frappe/wiki' }}
    name: Server (develop, sqlite)

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Get OS version
        id: os
        run: echo "version=$(. /etc/os-release && echo "$VERSION_ID")" >> "$GITHUB_OUTPUT"

      - name: Cache pip and uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-uv-ubuntu-${{ steps.os.outputs.version }}-develop-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-ubuntu-${{ steps.os.outputs.version }}-develop-
            ${{ runner.os }}-uv-ubuntu-${{ steps.os.outputs.version }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Pilot
        run: |
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh -s -- --ci
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch develop --database sqlite
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          pilot -b frappe-bench init

      - name: Install Wiki
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          uv pip install --python env/bin/python -e "apps/frappe[test]"
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
        env:
          CI: 'Yes'

      - name: Start Pilot
        run: |
          pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7000/api/v1/health

      - name: Create Test Site
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot new-site test_site --admin-password admin --apps frappe wiki --skip-assets
          pilot build --apps wiki

      - name: Run Tests
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot frappe --site test_site set-config allow_tests true
          pilot frappe --site test_site run-tests --app wiki --test-category all
        env:
          TYPE: server

      - name: Show Pilot logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/pilot.log" || true
